spring:
  application:
    name: carbontrack-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carbontrack}
    username: ${DB_USERNAME:carbontrack}
    password: ${DB_PASSWORD:carbontrack}
  data:
   redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  cache:
   type: redis
   redis:
    time-to-live: 600000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

carbontrack:
  jwt:
    # Dev-only fallback. Always set JWT_SECRET (>= 32 chars) outside local development.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    expiration: ${JWT_EXPIRATION:PT24H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
